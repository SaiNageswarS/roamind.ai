# The curated news interests (owner ''), seen by every user: name, whether
# every user follows it (default), its rubric (prose in rubrics/*.md) and its
# RSS/Atom feeds. Loaded by `task init` (`worker -seed`); safe to repeat.
# Interests are added or updated, and curated ones no longer listed here are
# deleted with their follows.
