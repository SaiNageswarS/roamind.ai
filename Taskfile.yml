# Roamind build and setup tasks (https://taskfile.dev). Long-running
# processes live in process-compose.yaml (`process-compose up`); everything
# one-shot lives here. `task` lists the tasks; pass arguments after `--`,
# e.g. `task bm -- project info`.
version: '3'

dotenv: ['.env']
set: [errexit, pipefail]

vars:
  MODULES: agent channels connectors memory worker mcp
  WITH_HATCHET: deploy/bin/with-hatchet.sh
  HATCHET_VERSION: v0.110.22 # keep in step with the Go SDK in worker/go.mod
  CADDY_VERSION: v2.11.7
  CADDY_TAILSCALE: de41b249af4f
  XCADDY_VERSION: v0.4.7
  CLASP_VERSION: 2.4.2
  VLLM_VERSION: 0.30.0
  QUESTDB_VERSION: 10.1.0
  QUESTDB: bin/questdb-{{.QUESTDB_VERSION}}
  # The Python that parsers of broker reports run on, in the agent's
  # sandbox. It is outside the home directory, which the sandbox can't read.
  REPORT_PYTHON: /opt/roamind/py
  SEARCH_MODELS: Qwen/Qwen3-Embedding-0.6B Qwen/Qwen3-Reranker-0.6B
  # How init brings a project's bm config.json ($cfg) up to date: the
  # settings in memory/basic-memory-config.json over it, keeping bm's own
  # keys, and its paths. notes.Setup writes the same for a new project
  # (TestSetupMatchesTaskInit). init pastes it inside single quotes, so it
  # must not contain one.
  BM_CONFIG: '.[0] * .[1] | .projects = {($p): {path: $notes, mode: "local"}} | .default_project = $p | .project_root = $notes | .semantic_embedding_cache_dir = $cache'

tasks:
  default:
    cmds: [task --list]
    silent: true

  build:
    desc: Build bin/worker and bin/mcp
    deps: [worker, mcp]

  all:
    desc: Build bin/caddy, bin/worker and bin/mcp
    deps: [build, caddy]

  worker:
    desc: Build bin/worker
    sources: ['agent/**/*.go', 'channels/**/*.go', 'connectors/**/*.go', 'memory/**/*.go', 'worker/**/*.go', '**/go.mod', '**/go.sum']
    generates: [bin/worker]
    cmds: [go build -o bin/worker ./worker/cmd/worker]

  mcp:
    desc: Build bin/mcp, the MCP server claude starts per chat turn
    sources: ['connectors/**/*.go', 'memory/**/*.go', 'mcp/**/*.go', '**/go.mod', '**/go.sum']
    generates: [bin/mcp]
    cmds: [go build -o bin/mcp ./mcp/cmd/mcp]

  caddy:
    desc: Build bin/caddy with the Tailscale plugin (rebuilt when its versions here change)
    sources: [Taskfile.yml]
    generates: [bin/caddy]
    cmds:
      - >-
        go run github.com/caddyserver/xcaddy/cmd/xcaddy@{{.XCADDY_VERSION}} build {{.CADDY_VERSION}}
        --with github.com/tailscale/caddy-tailscale@{{.CADDY_TAILSCALE}} --output bin/caddy

  # Every step is safe to repeat; process-compose runs this before the
  # worker. Needs the sqlite3 CLI (for readfile and JSON) and jq. New users'
  # projects are created by the user-setup workflow; this brings existing
  # ones up to date.
  init:
    desc: From memory/, create the store's and QuestDB's tables, load the curated interests, and bring every Basic Memory project up to date
    cmds:
      - mkdir -p "${ROAMIND_DATA_DIR:-./data}/memory/fastembed_cache"
      - cat memory/sql-schemas/*.sql | sqlite3 -bail "${ROAMIND_DATA_DIR:-./data}/roamind.db"
      - sqlite3 -bail "${ROAMIND_DATA_DIR:-./data}/roamind.db" ".read memory/seed/interests.sql"
      # QuestDB's tables, from memory/questdb-schemas.
      - ./bin/worker -questdb-init
      - |
        # A project whose config.json jq can't merge into is skipped, with a
        # warning, so one bad file doesn't keep the worker down.
        mem="$(realpath "${ROAMIND_DATA_DIR:-./data}/memory")"
        for project in "$mem"/users/*; do
          cfg="$project/config/config.json"
          [ -f "$cfg" ] || continue
          if jq -s --arg p "${project##*/}" --arg notes "$project/notes" --arg cache "$mem/fastembed_cache" \
              '{{.BM_CONFIG}}' "$cfg" memory/basic-memory-config.json > "$cfg.tmp"; then
            mv "$cfg.tmp" "$cfg"
          else
            rm -f "$cfg.tmp"
            echo "init: skipped $cfg: jq could not merge the settings into it" >&2
          fi
          # Schema notes are the repo's: a changed one replaces the project's.
          mkdir -p "$project/notes/schemas"
          for schema in memory/basic-memory-schemas/*.md; do
            dst="$project/notes/schemas/${schema##*/}"
            cmp -s "$schema" "$dst" || cp "$schema" "$dst"
          done
        done

  hatchet-env:
    desc: Start the Hatchet server, register the webhooks, open the Funnel
    cmds:
      - task: hatchet
      - task: webhook
      - task: funnel

  hatchet:
    desc: Start the Hatchet server only (hatchet server start)
    cmds:
      - hatchet server start --tag {{.HATCHET_VERSION}} --pull-policy missing --profile "${HATCHET_PROFILE:-local}"
      - "{{.WITH_HATCHET}} sh -c 'until curl -sf \"$HATCHET_CLIENT_SERVER_URL/api/ready\" >/dev/null; do sleep 2; done'"

  webhook:
    desc: Create or update the Hatchet webhooks, slack and gmail, for the secrets set
    cmds:
      - |
        if [ -z "${SLACK_SIGNING_SECRET:-}" ] && [ -z "${ROAMIND_MAIL_SECRET:-}" ]; then
          echo "neither SLACK_SIGNING_SECRET nor ROAMIND_MAIL_SECRET is set; skipping webhooks"
          exit 0
        fi
        {{.WITH_HATCHET}} go run ./worker/cmd/setup-webhook

  # Mail reaches Roamind from an Apps Script in each Gmail account
  # (deploy/apps-script), through the gmail webhook; these record which
  # user an account belongs to, and push the script.
  mail-connect:
    desc: "Connect a Gmail account to a Roamind user and print its script's key, e.g. task mail-connect -- you@example.com you@gmail.com"
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        [ $# -eq 2 ] || { echo "usage: task mail-connect -- <roamind user email> <gmail address>" >&2; exit 1; }
        db="${ROAMIND_DATA_DIR:-./data}/roamind.db"
        quote() { printf "'%s'" "$(printf %s "$1" | sed "s/'/''/g")"; }
        user="$(sqlite3 -bail "$db" "SELECT id FROM users WHERE lower(email) = lower(trim($(quote "$1")))")"
        [ -n "$user" ] || { echo "no Roamind user with email $1" >&2; exit 1; }
        # The account's own key, which its script signs with; connecting
        # again makes a new one.
        secret="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')"
        [ ${#secret} -eq 64 ] || { echo "could not make a key" >&2; exit 1; }
        sqlite3 -bail "$db" "INSERT INTO mail_accounts (address, user_id, secret, connected_at)
          VALUES (trim($(quote "$2")), '$user', '$secret', CAST(strftime('%s', 'now') AS INTEGER))
          ON CONFLICT (address) DO UPDATE SET user_id = excluded.user_id, secret = excluded.secret,
            connected_at = excluded.connected_at"
        echo "connected $2 to $1"
        echo "set the script property ACCOUNT_SECRET of $2's script to:"
        echo "  $secret"
        echo "then push the script with task mail-script and run its setup()"

  mail-disconnect:
    desc: "Disconnect a Gmail account, e.g. task mail-disconnect -- you@gmail.com (then delete its script's trigger)"
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        [ $# -eq 1 ] || { echo "usage: task mail-disconnect -- <gmail address>" >&2; exit 1; }
        addr="$(printf %s "$1" | sed "s/'/''/g")"
        sqlite3 -bail "${ROAMIND_DATA_DIR:-./data}/roamind.db" "DELETE FROM mail_accounts WHERE address = trim('$addr')"
        echo "disconnected $1"

  mail-script:
    desc: "Push the mail Apps Script to a Gmail account's script project, e.g. task mail-script -- <script id>; clasp login as that account first"
    dir: deploy/apps-script
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        [ $# -eq 1 ] || { echo "usage: task mail-script -- <script id>" >&2; exit 1; }
        printf '{"scriptId": "%s"}\n' "$1" > .clasp.json
        # clasp exits 0 when Google refuses the push, and may still print
        # "Pushed"; its "Push failed" is what tells.
        out="$(npx --yes @google/clasp@{{.CLASP_VERSION}} push --force 2>&1)"
        printf '%s\n' "$out" | grep -v '^\s*at ' | head -40
        if printf '%s' "$out" | grep -q 'Push failed'; then exit 1; fi

  funnel:
    desc: Expose only the Hatchet webhooks path (Slack, gmail) publicly via Tailscale Funnel
    cmds:
      - |
        {{.WITH_HATCHET}} bash -c '
          set -euo pipefail
          webhooks="/api/v1/stable/tenants/${HATCHET_CLIENT_TENANT_ID}/webhooks"
          tailscale funnel --bg --https=443 --set-path "$webhooks" "http://${HATCHET_UPSTREAM}${webhooks}"
          host="$(tailscale status --json | sed -n "s/.*\"DNSName\": *\"\([^\"]*\)\.\".*/\1/p" | head -1)"
          echo "Slack Request URL: https://${host}${webhooks}/slack"
          tailscale funnel status'

  notebook:
    desc: Install the tailnet notebook's Python environment (JupyterLab, Notebook 7, JAX on CUDA) from notebook/uv.lock
    sources: [notebook/pyproject.toml, notebook/uv.lock]
    cmds:
      - uv sync --project notebook --frozen --managed-python

  vllm:
    desc: Install vLLM and download the GPU search models
    cmds:
      # A uv-managed Python ships the headers Triton compiles against.
      - uv tool install "vllm=={{.VLLM_VERSION}}" --python 3.12 --managed-python
      - for: {var: SEARCH_MODELS}
        cmd: '"$(uv tool dir)/vllm/bin/hf" download {{.ITEM}} >/dev/null'

  # QuestDB holds the finance assistant's time series. The "rt" build
  # bundles its Java runtime.
  questdb-install:
    desc: Download QuestDB into bin/questdb-<version>, unless it is there
    status: ['test -x {{.QUESTDB}}/bin/questdb.sh']
    cmds:
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fL --retry 3 -o "$tmp/questdb.tar.gz" \
          "https://github.com/questdb/questdb/releases/download/{{.QUESTDB_VERSION}}/questdb-{{.QUESTDB_VERSION}}-rt-linux-x86-64.tar.gz"
        tar -xzf "$tmp/questdb.tar.gz" -C "$tmp"
        mkdir -p bin
        mv "$tmp/questdb-{{.QUESTDB_VERSION}}-rt-linux-x86-64" {{.QUESTDB}}

  # Configured by deploy/bin/run-questdb.sh: loopback only; QWP (what
  # Roamind uses), the web console and REST API on 9000, health on 9003;
  # Postgres wire and line protocol over TCP off. process-compose runs it as
  # `questdb`, in the foreground (task questdb -- -n); this starts it in the
  # background without the rest.
  questdb:
    desc: Start QuestDB in the background, downloading it first if needed (web console http://127.0.0.1:9000)
    deps: [questdb-install]
    cmds:
      - deploy/bin/run-questdb.sh {{.QUESTDB}} {{.CLI_ARGS}}

  questdb-stop:
    desc: Stop QuestDB
    cmds:
      - '{{.QUESTDB}}/bin/questdb.sh stop'

  # The agent writes a Python parser for each broker report format and runs
  # it in its sandbox (import_report in mcp/tools/finance.go). This is the
  # interpreter and libraries it runs on: the system Python with the locked
  # deploy/report-python/requirements.txt, copied (not linked) out of uv's
  # cache in the home directory. /opt/roamind must exist and be yours:
  #   sudo install -d -o "$USER" /opt/roamind
  report-python:
    desc: Install the Python that report parsers run on into /opt/roamind/py
    status: ['cmp -s deploy/report-python/requirements.txt {{.REPORT_PYTHON}}/requirements.txt']
    preconditions:
      - sh: test -w "$(dirname {{.REPORT_PYTHON}})"
        msg: 'run: sudo install -d -o "$USER" {{dir .REPORT_PYTHON}}'
    cmds:
      - uv venv --allow-existing --python /usr/bin/python3 {{.REPORT_PYTHON}}
      - uv pip install --link-mode copy --python {{.REPORT_PYTHON}}/bin/python --require-hashes -r deploy/report-python/requirements.txt
      - cp deploy/report-python/requirements.txt {{.REPORT_PYTHON}}/requirements.txt

  # process-compose runs in the foreground without its TUI; systemd is the
  # daemon (Linger keeps the user manager up from boot). Attach to it with
  # `process-compose attach`.
  service:
    desc: Install and enable the roamind systemd user service, which runs process-compose at boot
    cmds:
      - |
        unit="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/roamind.service"
        echo "writing $unit"
        mkdir -p "$(dirname "$unit")"
        cat >"$unit" <<UNIT
        [Unit]
        Description=Roamind (process-compose: caddy, embed, rerank, notebook, questdb, init, worker)
        After=network-online.target

        [Service]
        Type=simple
        WorkingDirectory={{.ROOT_DIR}}
        Environment=PATH=$PATH
        ExecStart=$(command -v process-compose) up --tui=false
        Restart=on-failure
        RestartSec=10

        [Install]
        WantedBy=default.target
        UNIT
      - systemctl --user daemon-reload
      - systemctl --user enable roamind.service
      - |
        [ "$(loginctl show-user "$USER" -p Linger --value)" = yes ] ||
          echo "enable boot start without login: sudo loginctl enable-linger $USER"

  test:
    desc: Run go test in every module
    cmds:
      - for: {var: MODULES}
        cmd: cd {{.ITEM}} && go test ./...

  vet:
    desc: Run go vet in every module
    cmds:
      - for: {var: MODULES}
        cmd: cd {{.ITEM}} && go vet ./...

  bm:
    desc: "Run Basic Memory's CLI against a user's project (default: the only one), e.g. task bm -- project info"
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        users="${ROAMIND_DATA_DIR:-./data}/memory/users"
        if [ $# -gt 0 ] && [ -d "$users/$1" ]; then
          project="$1"; shift
        else
          all="$(ls "$users" 2>/dev/null || true)"
          if [ -z "$all" ] || [ "$(echo "$all" | wc -l)" -ne 1 ]; then
            echo "usage: task bm -- <project> <bm args>; projects:" $all >&2
            exit 1
          fi
          project="$all"
        fi
        # Scoped to this command, so your own bm and MCP setups never see it.
        BASIC_MEMORY_CONFIG_DIR="$(cd "$users/$project/config" && pwd)" bm "$@"

  turn:
    desc: 'Run one agent turn from the terminal, e.g. task turn -- "hello"'
    cmds:
      - go run ./agent/cmd/turn -data "${ROAMIND_DATA_DIR:-./data}" {{.CLI_ARGS}}
