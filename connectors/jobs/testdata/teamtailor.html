  {

    "title": "UK Account Executive - SMB",
    "description": "&lt;h4&gt;Let&#39;s build the future together!&lt;/h4&gt;&lt;p&gt;&lt;a target=&quot;_blank&quot; href=&quot;https://www.teamtailor.com/en/&quot;&gt;Teamtailor&lt;/a&gt; is an Employer Branding and an ATS SaaS platform used by over 13,000 companies, 250.000 users in 90 countries around the world.&lt;/p&gt;&lt;p&gt;Working at Teamtailor means working at a global, international, and fast-paced tech company that offers an ideal workplace for those who want to have a real impact on the growth of an organisation and are craving for responsibilities. It also means having lots of fun!!! 🥳&lt;/p&gt;&lt;p&gt;&lt;span style=&quot;font-size:1em;font-weight:initial;letter-spacing:-0.011em;&quot;&gt;Building a diverse team with various backgrounds and expertise is at the core of Teamtailor since its very beginning, and is truly a part of our strength today! There are no typical profiles, except that every team member shares our vision and wants to be part of our success. Join us in our mission to help companies and people interact with each other in a better way so that they can make life-changing decisions together.&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;We are now looking for an &lt;strong&gt;Account Executive&lt;/strong&gt; to join the team from our &lt;strong&gt;Farringdon office&lt;/strong&gt; - this role is perfect for someone who thrives on ownership, moves fast, and loves building their own book of business!&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;We work hard and have lots of fun along the way, but every call counts, and we&#39;re looking for someone who takes &lt;strong&gt;real accountability for their numbers and stays proactive&lt;/strong&gt; about hitting them, not just aiming for them. You will be instrumental in driving Teamtailor&#39;s growth across the &lt;strong&gt;SMB+Mid-Market &lt;/strong&gt;segment, running &lt;strong&gt;high-velocity sales cycles&lt;/strong&gt; from first contact through to close.&lt;/span&gt;&lt;/p&gt;&lt;h4&gt;&lt;span&gt;Key Responsibilities:&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Take &lt;strong&gt;full ownership and accountability&lt;/strong&gt; of your pipeline and your numbers, treating every call and every deal as if it&#39;s the one that matters most&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;strong&gt;Build and nurture&lt;/strong&gt; your own book of business through proactive, self-generated, multi-channel outreach, never waiting for pipeline to come to you&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Run structured, consultative discovery and &lt;strong&gt;use MEDDPICC &lt;/strong&gt;diligently to qualify every opportunity&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Manage a &lt;strong&gt;high volume of fast-moving deals&lt;/strong&gt; with a high degree of detail and accuracy&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Keep &lt;strong&gt;pipeline hygiene and CRM data clean&lt;/strong&gt;, accurate and up to date at all times, no exceptions&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Deliver &lt;strong&gt;compelling product demonstrations &lt;/strong&gt;tailored to each prospect&#39;s needs&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;strong&gt;Collaborate closely with Customer Success&lt;/strong&gt; and the wider Sales team to ensure smooth handovers at close&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Provide reliable &lt;strong&gt;weekly and monthly forecasts &lt;/strong&gt;you can be held to&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Consistently and proactively hit your monthly and quarterly revenue targets, and &lt;strong&gt;take ownership &lt;/strong&gt;when a number is at risk rather than waiting to be asked&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Bring your experience selling in the tech space to help upskill the wider team&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h4&gt;&lt;span&gt;We are looking for someone with:&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;A track record of selling in the tech space, ideally &lt;strong&gt;SaaS,&lt;/strong&gt; with a genuine passion for sharing that knowledge with the team&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Experience working in a &lt;strong&gt;high-performance, target-driven sales culture,&lt;/strong&gt; where you&#39;re comfortable being held to your numbers&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;A s&lt;strong&gt;trong sense of personal accountability&lt;/strong&gt; and ownership - you treat your pipeline like your own business and don&#39;t need to be chased to stay on top of it&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Genuinely proactive by nature - you spot when a number is slipping and act on it before anyone has to flag it&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Strong attention to detail, particularly when managing several fast-moving deals at once&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Familiarity with &lt;strong&gt;MEDDPICC or a similar qualification framework&lt;/strong&gt;&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Excellent pipeline hygiene and &lt;strong&gt;CRM discipline &lt;/strong&gt;(Salesforce &amp;amp; Gong experience preferred)&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Emotional intelligence and strong communication skills, with the ability to build genuine relationships with prospects&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;An &lt;strong&gt;inquisitive, hungry mindset &lt;/strong&gt;- always looking to improve and develop&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;The ability to&lt;strong&gt; take feedback well &lt;/strong&gt;and act on it quickly&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;A team-first attitude, willing to share knowledge and support colleagues&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h4&gt;&lt;span&gt;What we have to offer:&lt;/span&gt;&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;The opportunity to sell the market&#39;s leading employer branding and recruitment platform&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Fixed salary together with a variable commission plan, we apply a generous model with no cap&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Company pension&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Development opportunities in a fast-growing environment, continuous training, and support&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Generous PTO (25 days) and you will be able to attend our yearly 3-day company trip&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Tons of team events, celebrations, monthly competitions and rewards for those who like challenges&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Starter kit which includes a Macbook Air, iPhone, and the must-have Teamtailor merch, free breakfast and fika&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;The opportunity to work with a talented, fun and kind group of individuals, based in our Farringdon office&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;span&gt;If this sounds like you, then you know what to do!&lt;/span&gt;&lt;/p&gt;&lt;figure data-alignment=&quot;left&quot; class=&quot;relative&quot; style=&quot;width:fit-content;margin-left:0px;margin-right:auto;&quot;&gt;&lt;img src=&quot;https://images.teamtailor-cdn.com/images/s3/teamtailor-production/original-v3/image_uploads/e54f4356-afde-4ed2-acda-2cf1e369b392/original.jpeg&quot; alt=&quot;Team picture on the beach&quot; title=&quot;&quot; data-alignment=&quot;left&quot;&gt;&lt;/figure&gt;&lt;p&gt;&lt;/p&gt;",
