[llm]
provider = anthropic
model = claude-sonnet-4-6
temperature = 0.2
max_tokens = 1024
top_p =
top_k =
timeout = 30
max_retries = 2
cache_enabled = true
cache_ttl_seconds = 86400

[mongo]
# MONGO_URI env var overrides this. Leave blank to disable persistent memory
# (agent runs in Redis-only mode: hot cache works, core/transcript no-op).
uri =
db_name = roamind

[memory]
# Short-term hot-cache token budget per user (LLM-visible context).
hot_cache_max_tokens = 4000
# tiktoken encoding used for approximate token counting. cl100k_base is a
# reasonable approximation for both OpenAI and Anthropic models.
token_encoding = cl100k_base
# Max number of turns to rehydrate from Mongo on a hot-cache miss.
rehydrate_max_turns = 20
