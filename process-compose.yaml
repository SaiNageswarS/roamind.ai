# Long-running Roamind processes: `process-compose up` (reads ./.env).
#
# Prerequisites (one-shot, see Taskfile.yml):
#   task hatchet-env   Hatchet server + Slack webhook + Funnel
#   task all           bin/caddy, bin/worker, bin/mcp
#
# Processes that talk to Hatchet run through deploy/bin/with-hatchet.sh, which
# loads the Hatchet CLI profile created by `hatchet server start`.
version: "0.5"
log_location: ./data/logs/process-compose.log
processes:
  caddy:
    description: Tailnet-only dashboards (hatchet.<tailnet>.ts.net, ...)
    command: deploy/bin/run-caddy.sh
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 2019
        path: /config/
      initial_delay_seconds: 2
      period_seconds: 5
    availability:
      restart: on_failure
      backoff_seconds: 5

  embed:
    description: Qwen3-Embedding-0.6B on the GPU for Basic Memory search (127.0.0.1:8800)
    command: deploy/bin/run-vllm.sh embed
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8800
        path: /health
      initial_delay_seconds: 10
      period_seconds: 5
      failure_threshold: 60
    availability:
      restart: on_failure
      backoff_seconds: 10

  rerank:
    description: Qwen3-Reranker-0.6B on the GPU for Basic Memory search (127.0.0.1:8801)
    command: deploy/bin/run-vllm.sh rerank
    # Start after embed: each vLLM sizes itself from the GPU memory it sees.
    depends_on:
      embed:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8801
        path: /health
      initial_delay_seconds: 10
      period_seconds: 5
      failure_threshold: 60
    availability:
      restart: on_failure
      backoff_seconds: 10

  # Tables, curated interests and Basic Memory schema notes from memory/;
  # safe to repeat, so it runs before every worker start.
  init:
    description: Prepare the store and memory projects from memory/
    command: task init

  worker:
    description: Roamind Hatchet worker (chat-turn)
    command: deploy/bin/with-hatchet.sh ./bin/worker
    depends_on:
      init:
        condition: process_completed_successfully
      rerank:
        condition: process_healthy
    availability:
      restart: on_failure
      backoff_seconds: 5
