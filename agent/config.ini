[llm]
provider = anthropic
model = claude-sonnet-4-6
temperature = 0.2
max_tokens = 1024
top_p =
top_k =
timeout = 30
max_retries = 2
cache_enabled = true
cache_ttl_seconds = 86400

[mongo]
# MONGO_URI env var overrides this. Leave blank to disable persistent memory
# (agent runs in Redis-only mode: hot cache works, core/transcript no-op).
uri =
db_name = roamind

[memory]
# Number of recent messages kept in Redis short-term per user.
short_term_max_messages = 8
